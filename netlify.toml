[build]
  # The check runs before Eleventy because a Netlify build is the only place
  # that can see whether anything outside the repo is overriding the Node
  # version, and whether the build got the version it asked for — see
  # the environment block below.
  command = "node scripts/check_function_dependencies.js && npm run build"
  publish = "dist"

[build.environment]
  # Applies to every deploy context at once — production, deploy preview and
  # branch deploy alike. The per-context blocks this replaces covered the first
  # two and left a branch deploy on whatever default Netlify happened to ship.
  #
  # One number, and it decides both. Netlify has derived the functions runtime
  # from the build's Node since May 2023, and AWS_LAMBDA_JS_RUNTIME exists to
  # break that link when you need the two to differ. This repo does not, so
  # nothing sets it and this line is the whole configuration.
  #
  # That is worth stating because of how the alternative failed. An
  # AWS_LAMBDA_JS_RUNTIME set in the Netlify UI — read from there only, never
  # from this file, so the nodejs18.x lines that used to sit in this block
  # never applied — kept the API on nodejs18.x for years, deprecated by AWS in
  # September 2025, while this file said Node 22 and nothing in the repo could
  # contradict it. #185 found it by deploying a function that reported
  # process.version, which was the only way to find it. The fix is not a better
  # comment: it is having one place, this one, and a check that fails the
  # deploy if anything outside the repo starts overriding it again.
  #
  # AWS ships a managed Lambda runtime only for Node majors on the LTS track,
  # so nodejs25.x does not exist and never will, and Netlify substitutes Node
  # 24 for a build version it cannot map — silently.
  # check_function_dependencies.js keeps the list of majors that do exist, so
  # an unshippable number fails the build instead of landing the functions on a
  # version nothing in the repo mentions.
  #
  # nodejs26.x is an AWS public-preview runtime: no SLA, no support, breaking
  # changes possible and applied automatically, with general availability
  # targeted for November 2026, when Node 26 reaches Active LTS. For a hobby
  # project that is a choice rather than an oversight, and the point is that it
  # is made here rather than in a dashboard.
  # https://docs.netlify.com/build/configure-builds/manage-dependencies/
  # https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
  NODE_VERSION = "26"

  # Netlify installs devDependencies too, so its build was carrying the same
  # 1319 packages of `netlify-cli` that CI was — a deploy preview reinstalling
  # the Netlify CLI on Netlify. Nothing the build runs comes from that list:
  # `npm run build` needs `cross-env` and Eleventy, and `cross-env` is a
  # `dependency` for exactly this reason.
  #
  # Unlike the CI flag this one cannot be checked from a laptop; the deploy
  # preview on the pull request that adds it is the test. If it ever stops
  # being honoured the build gets slower, not wrong.
  NPM_FLAGS = "--omit=dev"

# There is deliberately no `[[headers]]` block here. #157 declared
# `Cache-Control` for `/js/*` and `/css/*` this way and it never applied:
# production kept answering the hashed bundle `public,max-age=0,
# must-revalidate`, and Netlify's deploy summary reported "Header rules" as
# `skipping` every time, while "Redirect rules" reported `pass`. The rules live
# in `_headers`, a file in the publish directory the way `_redirects` is, and
# declared there they arrive: both assets come back `immutable` and that check
# passes. Moving them back here would switch the caching off silently, without
# failing a build or a test.

[functions]
  directory = "src/api/routes"

  # The functions runtime is started with `--no-experimental-require-module`,
  # so `require` of an ES module throws `ERR_REQUIRE_ESM` and every route 502s
  # while the module is being read. That is #162 (`uuid` 13) and it nearly was
  # #168 (`jose` 6). The flag is passed by AWS on the command line, by name,
  # and #185 read it off `process.execArgv` on `nodejs22.x` and `nodejs26.x`
  # alike — identical both times, on a Node where `require(esm)` has been
  # stable for two releases. It is policy, not version drift, so waiting for a
  # newer runtime is not a plan and `NODE_OPTIONS` cannot undo it: a
  # command-line flag beats `NODE_OPTIONS`.
  #
  # esbuild inlines dependencies at build time, so the deployed function has
  # no module boundary left for the runtime to refuse. The default bundler,
  # `zisi`, copies each function verbatim and ships `node_modules` beside it,
  # which is why the boundary survived to production.
  node_bundler = "esbuild"

  # `mongodb` reaches its optional native extras — `kerberos`, `snappy`,
  # `aws4`, `mongodb-client-encryption` and the rest — through requires inside
  # `try`/`catch`, for packages that are deliberately not installed. A bundler
  # has to resolve what it inlines, so bundling the driver means failing on
  # every one of them. Left external it is copied rather than inlined, exactly
  # as `zisi` did for everything, which is safe here because the driver is
  # requireable CommonJS — the one dependency #170 checked by hand.
  external_node_modules = ["mongodb"]

[dev]
  command = "npm run start"
  # Netlify Dev waits for this port specifically, so the `dev` script passes a
  # matching `--port` rather than leaving Eleventy on its default of 8080.
  targetPort = 8093
