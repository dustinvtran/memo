# Takes a snapshot of the whole database on a schedule, so that a backup
# exists because somebody decided it should rather than as a side effect of
# something else running.
#
# **Why this is not a step in refresh_metadata.yml, where a snapshot already
# happens.** That one is CLAUDE.md's first rule — a fresh snapshot immediately
# before every `--apply`, so the run that is about to write has an undo. It is
# gated on that run writing, which is right for its purpose and wrong as a
# backup regime: set `METADATA_REFRESH_APPLY` to `false` to pause the crawls
# and the nightly snapshot stops with them, silently, while the run still goes
# green. A variable named after metadata refreshing was load-bearing for
# disaster recovery. #303 is about exactly that shape of failure.
#
# So the two stay separate and both keep running. They answer different
# questions: that one asks "can I undo what I am about to do", this one asks
# "is there a copy of the database that is not in the Google Drive folder
# holding the code and the credentials".
#
# **This is the only backup that exists.** The cluster is Atlas M0, where
# `Disaster Recovery` reads `Backups Inactive` — the free tier has no provider
# backup at all, and its three-node replica set replicates a deletion as fast
# as it replicates anything else. The artifact below and the `backups/`
# directory on Drive are the two copies, and only one of them is off Drive.
name: Back up the database

on:
  # Twelve hours from the metadata refresh, so the two do not fail together
  # for a reason to do with the hour, and so a day holds two copies taken at
  # different times. Off the hour for the reason that one is: GitHub queues
  # every cron in the minute after the hour and runs them late.
  schedule:
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # A snapshot of this database is seconds. Ten minutes is generous enough
    # to absorb a slow runner and short enough that a hung job is ended rather
    # than left holding the group until the six-hour ceiling.
    timeout-minutes: 10
    steps:
      # Checked before anything is installed or opened. Without it an unset
      # secret gets as far as `backup_database.js` and dies on an empty
      # connection string, which reads like a database fault rather than the
      # unset setting it is. Name only — a masked secret echoed into a log is
      # still a secret in a log. #338.
      - name: Check the credential is set
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          if [ -z "$MONGODB_URL" ]; then
            echo "::error::Unset repository secret: MONGODB_URL"
            echo "Set it under Settings > Secrets and variables > Actions."                  "The value lives in src/db_maintenance/.env. See #338."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The same Node as `netlify.toml`, `ci.yml` and the refresh.
      # `src/db_maintenance` is CommonJS and requires three modules out of
      # `src/api`, which is ESM, so this needs a Node where `require(esm)` is
      # unflagged — 22.12 and up. See CLAUDE.md.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      # `--no-prune` because the retention policy in `backup_plan.js` is about
      # the Drive directory's history, and this snapshot is not part of it —
      # the runner's disk is thrown away either way. Retention here is the
      # artifact's own 90 days.
      #
      # `verify_backup.js --live` compares the manifest, the files, their
      # `sha256` and live `countDocuments()`, and exits non-zero when the first
      # three disagree. It runs *before* the upload on purpose: an artifact
      # nobody has checked is a backup nobody has checked, and the whole point
      # of #303 is that an untested backup is a hope.
      - name: Snapshot the database, and verify the snapshot
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          node src/db_maintenance/scripts/backup_database.js             --out="$RUNNER_TEMP/backups" --no-prune
          node src/db_maintenance/scripts/verify_backup.js             --dir="$RUNNER_TEMP/backups" --live

      - name: Keep the snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/backups
          retention-days: 90
