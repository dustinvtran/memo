name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The unit-tested modules are deliberately dependency-free, so the
      # suite runs without an install. Nothing here needs a database or an
      # API key.
      - name: Unit tests
        run: npm test

      # Cheap guard against a typo in the files the tests don't reach —
      # the Netlify functions and the frontend globals.
      - name: Syntax check every JS file
        run: git ls-files '*.js' | xargs -n1 node --check

  # The job above checks the inputs; this one checks what ships. `node --check`
  # reads each tracked file on its own, and `bundle.test.js` reconstructs the
  # concatenation from the templates as text — both good proxies, neither the
  # artefact. The bundle is forty files joined through Nunjucks and put through
  # UglifyJS, and every page on the site is drawn by that one file, so a syntax
  # change UglifyJS cannot parse blanks every url. Until this job existed that
  # only surfaced on Netlify, after merge.
  #
  # It needs an install, which is why it is separate rather than more steps on
  # the job above: keeping that one dependency-free is deliberate. The install
  # is also the only thing in CI that would notice a dependency removal that
  # breaks the build, or a `package-lock.json` out of step with `package.json`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches `netlify.toml`'s `[build.environment]`. The point of building
      # here is to build the way Netlify does, so the two versions stay equal.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # `_redirects` ends in a forced catch-all (`/* /index.html 200!`), so an
      # asset the build didn't write is not a 404 — it is served the homepage's
      # HTML. That is how `/js/bundle.js` once came back as `<!doctype html>`.
      # Nothing upstream fails when an asset silently stops being written, so
      # absence and emptiness both have to be asserted here.
      #
      # Both names carry a content hash now, so they are read back out of the
      # page that references them rather than written down. That checks the
      # join as well as the files: a bundle emitted under a name `index.html`
      # does not point at is exactly as broken as one never emitted at all, and
      # writing the names here again would be a third place for them to drift.
      - name: The shipped assets must exist and be non-empty
        run: |
          # The bundle and the stylesheet are read too, not just `index.html`.
          # `/img/mawaru.png` is the fallback cover on every row without one
          # and `/img/memo_logo.png` is the header, and both are named only
          # from JavaScript, so scanning the page alone never saw them.
          # Reading what shipped rather than listing it here also covers an
          # asset added later without anyone remembering to come back.
          #
          # The url has to be preceded by something that cannot be part of a
          # path - a quote, a `(` - so that a CDN url is not mistaken for one
          # of ours: Font Awesome's ends `/6.7.2/css/all.min.css`, and the
          # character before its `/css/` is a digit.
          urls=$(cat dist/index.html dist/js/bundle.*.js dist/css/main.*.css \
                 | grep -o '[^A-Za-z0-9._-]/\(js\|css\|img\)/[A-Za-z0-9._-]*' \
                 | cut -c2- | sort -u)
          if [ -z "$urls" ]; then
            echo "the build references no local js, css or img at all"
            exit 1
          fi
          for url in $urls; do
            if [ ! -s "dist$url" ]; then
              echo "the site references $url, which the build did not write" \
                   "and every url that asks for it is served the homepage's HTML"
              exit 1
            fi
            echo "ok: dist$url"
          done

      # Neither of these is referenced by anything, so the scan above cannot
      # reach them, and both are read by Netlify from the publish directory
      # rather than from the repo. They arrive by passthrough copy, which is
      # exactly the kind of thing that stops matching quietly.
      #
      # `_redirects` is the one whose absence breaks pages that are otherwise
      # fine: without it Netlify answers `/films/nil` with a 404 instead of
      # the app. `_headers` fails more quietly still — the site works, and
      # every hashed asset is re-fetched on every navigation, which is the
      # whole point of #142 undone with nothing to show for it.
      - name: The routing and header files must ship
        run: |
          for file in _redirects _headers; do
            test -s "dist/$file" || {
              echo "dist/$file is missing or empty, and Netlify reads it from" \
                   "the publish directory — nothing else will notice"
              exit 1
            }
            echo "ok: dist/$file"
          done

      # Today `npm run build` is what actually goes red on a bundle that will
      # not parse, because #135 made the `jsmin` filter throw. This asserts the
      # same thing about the artefact rather than about the build, so it still
      # holds if that one line in `.eleventy.js` is ever softened back to
      # returning its input — which is what it did before #135, and what let
      # `3c3fab0` ship. It is the cheap half of the pair, not the redundant one.
      - name: The bundle must parse
        run: |
          bundle=$(grep -o '/js/bundle\.[0-9a-f]*\.js' dist/index.html | head -1)
          node --check "dist$bundle"
