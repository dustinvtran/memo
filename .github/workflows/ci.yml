name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes anything: the three jobs below test, read
# the lockfile, build, and read two advisory feeds. The repository default is
# `write` (#301), and this overrides it for this workflow whatever that
# setting happens to be — which is the reason to say it here as well as in the
# settings, since the file is the half that survives a settings change. A job
# that ever does need more should raise it on itself rather than widening this.
permissions:
  contents: read

# A branch that gets three pushes in a minute had three full runs going at
# once, and the two the reviewer will never look at were still holding runners
# the third one needed. Cancelling is right for a pull request, where only the
# head commit's answer is ever read, and wrong for main, where every commit's
# result is the record of whether that commit was good — hence the condition
# rather than a plain `true`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The unit-tested modules are deliberately dependency-free, so the
      # suite runs without an install. Nothing here needs a database or an
      # API key.
      #
      # Which also means this is not the whole suite: the files that do need
      # the dependencies skip themselves here, and it is the `build` job that
      # runs them, on the install it already does.
      - name: Unit tests
        run: npm test

      # Cheap guard against a typo in the files the tests don't reach —
      # the Netlify functions and the frontend globals.
      #
      # One `node --check` per file is one process per file, and there are 154
      # of them — the spawning, not the parsing, is the cost. `-P4` runs a few
      # at a time; `-n1` stays because `node --check` reads a single file, and
      # xargs still fails the step if any one of them exits non-zero.
      - name: Syntax check every JS file
        run: git ls-files '*.js' | xargs -n1 -P4 node --check

  # `npm ci` is the only reader of `package-lock.json` that checks it against
  # `package.json` at all, and #396 is what happens when every reader in CI
  # runs the npm that reads it leniently. `npm ci` against main failed outright
  # on npm 10 — `EUSAGE`, `Missing: @netlify/blobs@10.7.13 from lock file` and
  # 21 more — while this workflow and Netlify stayed green, because both are
  # pinned to Node 24 and so to npm 11.
  #
  # Neither npm is wrong about the tree. The `unstorage` copy under
  # `node_modules/ipx` declares a peer dependency on `@netlify/blobs`
  # `^6.5.0 || ^7.0.0 || ^8.1.0 || ^9.0.0 || ^10.0.0`, which the hoisted
  # `11.1.0` satisfies none of, so a nested `@netlify/blobs@10.7.13` and its 20
  # transitive dependencies really are required. npm 10 pins that subtree in
  # the lockfile; npm 11 omits all 21 entries and re-resolves them at install
  # time. The npm 10 file is a strict superset, which is why npm 11 installs it
  # without complaint and why this job can be a guard rather than a dilemma.
  #
  # It is a guard because the fix does not hold on its own: a plain `npm
  # install` under npm 11 drops those 21 entries again, so the next dependabot
  # bump that regenerates the lockfile can put #396 back with nothing in CI
  # going red. This job is the reader that notices, and it is the only thing
  # here on npm 10.
  #
  # `--dry-run` is what makes that cheap. The sync check runs while the ideal
  # tree is built from the lockfile, before anything is fetched or written, so
  # the whole job is an npm install and about a second — no packages, no
  # scripts, no registry. `--omit=dev` would not dodge the failure either, for
  # the same reason: the check reads the whole lockfile before the tree is
  # pruned. Only `package.json` and `package-lock.json` are copied out so that
  # nothing else in the checkout — `src/api/package.json`, a script in
  # `package.json` — can take part in the answer.
  #
  # Pinning npm with `packageManager` was considered instead and rejected
  # (#411): Netlify reads that field and can activate Corepack from it, so it
  # risks changing which npm the deploy builds with, invisibly and outside the
  # repo, which is the shape of bug #198 removed. And pinning everyone to npm
  # 11 would hide this rather than fix it — the 21 packages would stay
  # unpinned, with no reader left to say so.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 like every other job here, which is not only tidiness:
      # `scripts/check_function_dependencies.js` reads every `node-version:`
      # in this file and fails if one of them differs from `netlify.toml`'s
      # `NODE_VERSION`. So npm 10 is installed over the npm that ships with
      # Node 24, rather than had for free by running this job on the Node 22
      # that still bundles it. Which is the better shape anyway: the version
      # this job turns on is then asked for by name rather than inherited.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The lockfile must satisfy npm 10, which reads all of it
        run: |
          npm install -g npm@10
          version=$(npm --version)
          echo "npm $version"
          # Asserted rather than assumed: on npm 11 every line below still
          # passes, and this job would quietly become a slower copy of the
          # install in `build` while reporting the same green tick.
          case "$version" in
            10.*) ;;
            *)
              echo "this step ran on npm $version, and it is only a check at" \
                   "all on npm 10 — npm 11 is the reader that cannot see #396"
              exit 1
              ;;
          esac

          dir="$RUNNER_TEMP/lockfile-check"
          mkdir -p "$dir"
          cp package.json package-lock.json "$dir/"
          cd "$dir"

          status=0
          npm ci --dry-run --no-audit --no-fund > "$dir/out.txt" || status=$?
          # A dry run names every one of the 1351 packages it would add, which
          # is the whole log and none of the answer. `--silent` is not the way
          # to quiet that: it takes the EUSAGE error with it and leaves a red
          # job saying nothing at all. So stdout is kept on disk and only its
          # last lines printed, and the failure — which npm writes to stderr —
          # passes straight through either way.
          tail -3 "$dir/out.txt"
          [ "$status" -eq 0 ] || {
            echo "npm 10 refuses this lockfile, so npm ci fails for anyone" \
                 "not on npm 11 — see the Missing: lines above and #396." \
                 "Regenerating on the pinned toolchain does not fix it: run" \
                 "npm install --package-lock-only under npm 10 (Node 22) and" \
                 "commit the result, which npm 11 installs cleanly too (#411)."
            exit "$status"
          }

  # The job above checks the inputs; this one checks what ships. `node --check`
  # reads each tracked file on its own, and `bundle.test.js` reconstructs the
  # concatenation from the templates as text — both good proxies, neither the
  # artefact. The bundle is forty files joined through Nunjucks and put through
  # UglifyJS, and every page on the site is drawn by that one file, so a syntax
  # change UglifyJS cannot parse blanks every url. Until this job existed that
  # only surfaced on Netlify, after merge.
  #
  # It needs an install, which is why it is separate rather than more steps on
  # the job above: keeping that one dependency-free is deliberate. The install
  # is also the only thing in CI that would notice a dependency removal that
  # breaks the build. It used to be said here that it was the only thing that
  # would notice a `package-lock.json` out of step with `package.json` too,
  # which #396 disproved: `npm ci` on npm 11 re-resolves what the lockfile
  # leaves out instead of failing, so the `lockfile` job above is what reads
  # that, on the npm that still checks.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches `netlify.toml`'s `NODE_VERSION`, and the script below asserts
      # it rather than leaving this comment to be believed. The point of
      # building here is to build the way Netlify does — and since Netlify
      # derives the functions runtime from the build, this number is also what
      # the deployed API runs on (#198).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--omit=dev` because the devDependencies are almost the whole install:
      # 1319 of the 1575 packages in the lockfile are `netlify-cli` and its
      # tree, which is here so that `npx netlify dev` works on a laptop and
      # which nothing in CI or on Netlify ever runs. Installing all of it took
      # longer than every check in this file put together.
      #
      # What makes that safe is that `cross-env` is a `dependency`: `npm run
      # build` calls it, so it is needed wherever the site is built rather than
      # only where it is developed. Moving it back under devDependencies would
      # break this job and the Netlify build with it, which is the one thing to
      # watch if these lists are ever tidied.
      - run: npm ci --omit=dev

      # The job above runs this same suite with nothing installed, which is
      # deliberate and which leaves 118 of the 541 tests skipped — every
      # controller test and all five `auth_*.test.js` files, so ownership
      # checks, token verification and the transaction on a save had never run
      # in CI on any commit until this step (#227). Those files probe for their
      # dependencies with `import()` and skip themselves when it throws; every
      # package they ask for is a `dependency` rather than a `devDependency`,
      # so the install above is enough, and the whole suite takes about eight
      # seconds with them present.
      #
      # The skip count is asserted rather than printed because a silent skip is
      # the failure this step exists to catch. A probe that throws for the
      # wrong reason — a `require.resolve` left behind in an ESM file, say —
      # is swallowed by its own `catch`, and the file then skips itself while
      # claiming the dependencies are missing. That is where
      # docs/module_system.md ends, and its remedy is to run the suite with the
      # dependencies installed and confirm nothing skips. Without the grep this
      # step would pass just as happily on `# skipped 118`, which is the
      # silence rather than the check.
      #
      # `--test-reporter=tap` is named rather than left to the default, which
      # changes with whether stdout is a terminal and takes the summary line
      # with it. The output goes to a file instead of through `tee` so that the
      # status being read is `npm test`'s and not the pipe's.
      - name: The whole suite, with the dependencies the other job does without
        run: |
          status=0
          npm test -- --test-reporter=tap > "$RUNNER_TEMP/test.tap" || status=$?
          cat "$RUNNER_TEMP/test.tap"
          [ "$status" -eq 0 ] || exit "$status"
          grep -qx '# skipped 0' "$RUNNER_TEMP/test.tap" || {
            echo "tests skipped with every dependency installed: a probe is" \
                 "throwing for the wrong reason and swallowing it in its own" \
                 "catch, so the file skips while claiming the dependencies" \
                 "are missing — see docs/module_system.md"
            exit 1
          }

      # The functions runtime is started with `--no-experimental-require-module`
      # — #185 read it off `process.execArgv` on the deployed runtime, the same
      # on `nodejs22.x` and `nodejs26.x` — so `require` of an ES module throws
      # while the module is being read, before a handler runs, and every route
      # 502s at once. That is #162: a `uuid` bump to a version shipping ESM
      # only, green here and broken the moment it shipped.
      #
      # `netlify.toml` now bundles with esbuild, which inlines dependencies at
      # build time so nothing reaches the runtime as a module. This step used
      # to load each route under the flag; that check has outlived its
      # question, because the source still says `require('jose')` while the
      # artefact has jose inlined, so an ESM-only dependency would fail it and
      # ship perfectly. What is still true is that bundling has to be on, and
      # that anything in `external_node_modules` bypasses it — those are what
      # the script checks, and it reads both out of `netlify.toml` rather than
      # keeping its own copy to drift.
      #
      # The same script asserts what the functions run *on*. That used to be
      # set outside the repo entirely and invisibly (#185); it is now
      # `NODE_VERSION`, which the functions inherit from the build. A checkout
      # can see most of that: that `netlify.toml` does not pretend to set
      # `AWS_LAMBDA_JS_RUNTIME`, that its Node major is one Netlify will
      # actually derive a runtime from — it substitutes Node 24 for one it
      # cannot map, after the build, silently — and that the pin above
      # matches it. What it cannot
      # see is an override set in the Netlify UI, or which Node Netlify really
      # used — so `netlify.toml` runs this script too, ahead of Eleventy.
      # Failing here is cheaper; failing there is the one that cannot be
      # skipped.
      #
      # `src/api` is ES modules now, which changes none of that — esbuild
      # flattens an ESM source to a CommonJS bundle either way. The script
      # also loads every route with `import()` and with the environment passed
      # through untouched, so a module that reads a credential while it is
      # being imported fails here. See docs/module_system.md.
      - name: The functions runtime and the API's dependencies must be what the repo says
        run: node scripts/check_function_dependencies.js

      - run: npm run build

      # `_redirects` ends in a forced catch-all (`/* /index.html 200!`), so an
      # asset the build didn't write is not a 404 — it is served the homepage's
      # HTML. That is how `/js/bundle.js` once came back as `<!doctype html>`.
      # Nothing upstream fails when an asset silently stops being written, so
      # absence and emptiness both have to be asserted here.
      #
      # Both names carry a content hash now, so they are read back out of the
      # page that references them rather than written down. That checks the
      # join as well as the files: a bundle emitted under a name `index.html`
      # does not point at is exactly as broken as one never emitted at all, and
      # writing the names here again would be a third place for them to drift.
      - name: The shipped assets must exist and be non-empty
        run: |
          # The bundle and the stylesheet are read too, not just `index.html`.
          # `/img/mawaru.png` is the fallback cover on every row without one
          # and `/img/memo_logo.png` is the header, and both are named only
          # from JavaScript, so scanning the page alone never saw them.
          # Reading what shipped rather than listing it here also covers an
          # asset added later without anyone remembering to come back.
          #
          # The url has to be preceded by something that cannot be part of a
          # path - a quote, a `(` - so that a CDN url is not mistaken for one
          # of ours: Font Awesome's ends `/6.7.2/css/all.min.css`, and the
          # character before its `/css/` is a digit.
          urls=$(cat dist/index.html dist/js/bundle.*.js dist/css/main.*.css \
                 | grep -o '[^A-Za-z0-9._-]/\(js\|css\|img\)/[A-Za-z0-9._-]*' \
                 | cut -c2- | sort -u)
          if [ -z "$urls" ]; then
            echo "the build references no local js, css or img at all"
            exit 1
          fi
          for url in $urls; do
            if [ ! -s "dist$url" ]; then
              echo "the site references $url, which the build did not write" \
                   "and every url that asks for it is served the homepage's HTML"
              exit 1
            fi
            echo "ok: dist$url"
          done

      # None of these is referenced by anything, so the scan above cannot
      # reach them. Two are read by Netlify out of the publish directory
      # rather than out of the repo; two are asked for by name by clients
      # that never read a page first. They arrive by passthrough copy and by
      # template, which is exactly the kind of thing that stops happening
      # quietly.
      #
      # `_redirects` is the one whose absence breaks pages that are otherwise
      # fine: without it Netlify answers `/films/nil` with a 404 instead of
      # the app. `_headers` fails more quietly still — the site works, and
      # every hashed asset is re-fetched on every navigation, which is the
      # whole point of #142 undone with nothing to show for it.
      #
      # `robots.txt` and `sitemap.xml` fail more quietly than either, which
      # is why they are here (#302). The forced catch-all answers a file the
      # build did not write with the homepage's HTML at `200`, so nothing
      # errors anywhere: a crawler is handed a page where a rules file should
      # be, which is #103 and #141 with a different filename. The `Sitemap:`
      # line is read as well, because a `site.url` that came out empty leaves
      # a robots.txt that ships, is non-empty, and points at nothing.
      - name: The files nothing links to must ship
        run: |
          for file in _redirects _headers robots.txt sitemap.xml; do
            test -s "dist/$file" || {
              echo "dist/$file is missing or empty — Netlify reads it from" \
                   "the publish directory, or answers it with the homepage's" \
                   "HTML, and nothing else will notice"
              exit 1
            }
            echo "ok: dist/$file"
          done
          grep -qE '^Sitemap: https?://[^ ]+/sitemap\.xml$' dist/robots.txt || {
            echo "dist/robots.txt names no absolute sitemap url, and a" \
                 "crawler has nothing to resolve a relative one against —" \
                 "see src/frontend/_data/site.js"
            exit 1
          }

      # Today `npm run build` is what actually goes red on a bundle that will
      # not parse, because #135 made the `jsmin` filter throw. This asserts the
      # same thing about the artefact rather than about the build, so it still
      # holds if that one line in `.eleventy.js` is ever softened back to
      # returning its input — which is what it did before #135, and what let
      # `3c3fab0` ship. It is the cheap half of the pair, not the redundant one.
      - name: The bundle must parse
        run: |
          bundle=$(grep -o '/js/bundle\.[0-9a-f]*\.js' dist/index.html | head -1)
          node --check "dist$bundle"

      # Nothing in CI read an advisory before this. It runs last on purpose: a
      # bundle that will not parse is more urgent news than a dependency that
      # wants upgrading, and the first step to fail stops the ones after it.
      #
      # `npm audit` exits non-zero whenever it finds anything at all, which
      # here is always, so its status is dropped and `check_audit.js` decides
      # what is worth failing over. The reasoning — why `--omit=dev`, and why
      # this is not the one-line `npm audit --audit-level=high` — is at the top
      # of that file, next to the list it is checking against.
      - name: No new advisory against anything that ships
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node .github/scripts/check_audit.js < "$RUNNER_TEMP/audit.json"

      # And the other half of what ships. The step above reads `npm audit`,
      # which reads `package.json` — while every script and stylesheet a
      # browser actually runs comes from a CDN and is in none of it. #218 is
      # what that had accumulated: seven of the nine pinned libraries carried
      # published advisories, one critical, against a page holding the
      # reader's `nf_jwt`, and nothing here could have said so.
      #
      # It needs neither the install nor the build — the versions are read out
      # of the two files that pin one, `layouts/base.njk` and
      # `js/utils/load_script.js`, and the advisories come from a plain POST to
      # registry.npmjs.org — so it could sit in the job above. It is here
      # instead, next to the check it is the counterpart of, for the same
      # reason that one runs last: a bundle that will not parse is more urgent
      # news than a library that wants upgrading.
      - name: No new advisory against anything the pages load from a CDN
        run: node .github/scripts/check_cdn_advisories.js
